name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build assets
        run: |
          npm ci
          npm run build

      # The Laravel application lives one level above public_html on Hostinger.
      # Keep public/ out of this sync so it is not recreated as a nested folder.
      - name: Sync Laravel application to domain root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          protocol: sftp
          local-dir: ./
          server-dir: domains/system.dgconphil.com/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/public/**
            **/tests/**

      # Upload the contents of public/ into public_html/, not public_html/public/.
      - name: Sync public files to Hostinger document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          protocol: sftp
          local-dir: public/
          server-dir: domains/system.dgconphil.com/public_html/

      - name: Refresh Laravel runtime on Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          script_stop: true
          script: |
            cd /home/u381418166/domains/system.dgconphil.com
            if [ -L public_html/storage ]; then
              target="$(readlink public_html/storage)"
              if [ "$target" != "../storage/app/public" ]; then
                rm public_html/storage
              fi
            elif [ -e public_html/storage ]; then
              echo "public_html/storage exists as a directory or file; refusing to overwrite it"
              exit 1
            fi
            if [ ! -L public_html/storage ]; then
              ln -s ../storage/app/public public_html/storage
            fi
            php artisan optimize:clear
            php artisan config:cache