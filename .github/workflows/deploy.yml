
name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -s public/build/manifest.json
          test -d public/build/assets

      - name: Upload compiled assets to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          source: "public/build"
          target: "/home/u381418166/domains/system.dgconphil.com/.builds/gha-${{ github.run_id }}"
          command_timeout: 10m

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          command_timeout: 20m
          script: |
            set -eu

            ROOT="/home/u381418166/domains/system.dgconphil.com"
            STAGE="$ROOT/.builds/gha-${{ github.run_id }}"

            cd "$ROOT"

            echo "Checking Laravel installation..."
            test -f artisan
            test -d public_html
            test -f public_html/index.php
            test -f "$STAGE/public/build/manifest.json"

            echo "Checking Git branch and working tree..."
            test "$(git branch --show-current)" = "main"
            test -z "$(git status --porcelain --untracked-files=no)"

            echo "Updating Laravel source code..."
            git pull --ff-only origin main

            echo "Synchronizing public files..."
            rsync -av \
              --exclude='/index.php' \
              --exclude='/.htaccess' \
              --exclude='/storage' \
              --exclude='/build' \
              public/ public_html/

            echo "Publishing compiled assets..."
            mkdir -p public_html/build

            rsync -av \
              --exclude='/manifest.json' \
              "$STAGE/public/build/" \
              public_html/build/

            cp "$STAGE/public/build/manifest.json" \
              public_html/build/manifest.json

            echo "Checking uploaded file storage..."
            test -L public_html/storage
            test "$(readlink public_html/storage)" = "../storage/app/public"

            echo "Clearing Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache

            echo "Verifying frontend manifest..."
            test -s public_html/build/manifest.json

            echo "Removing temporary build files..."
            rm -rf "$STAGE"

            echo "Deployment completed successfully!"
